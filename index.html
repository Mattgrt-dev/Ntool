<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0E10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NTOOL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>
<title>NTOOL</title>
<meta name="theme-color" content="#0D0E10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
:root{color-scheme:dark;--bg:#0D0E10;--fg:#EEF0F3}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;display:flex;justify-content:center}
#root{width:100%;max-width:480px;height:100%;position:relative}
.app{width:100% !important;height:100% !important}

body{margin:0;background:#0D0E10}
a{color:#7CC4FF}a:hover{color:#B5DEFF}
button{font-family:inherit;cursor:pointer}
input{font-family:'JetBrains Mono',monospace}
.scroll::-webkit-scrollbar{width:0;height:0}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff !important}
  body *{visibility:hidden !important}
  .a4sheet,.a4sheet *{visibility:visible !important}
  .app{overflow:visible !important;height:auto !important}
  .a4wrap{position:static !important;overflow:visible !important;background:#fff !important}
  .a4sheet{position:absolute !important;left:0;top:0;width:186mm !important;box-shadow:none !important;padding:0 !important;margin:0 !important}
  .a4zone{break-inside:avoid}
  .noprint{display:none !important}
}

</style>
<div id="root"></div>
<template id="tpl">

<div class="app" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0D0E10; color: #EEF0F3; font-family: 'Barlow', sans-serif; font-size: 15px; display: flex; flex-direction: column">


<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 32px 20px 20px; gap: 22px">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 1px; line-height: 1">N<span style="color: rgb(124, 196, 255)">TOOL</span></div>
    <div style="font-size: 15px; color: #9AA1AC">AV Tools</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" onClick="{{goDmx}}" style="height: 116px; border-radius: 20px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; text-align: left">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="10" r="1"></circle><circle cx="16" cy="10" r="1"></circle><circle cx="12" cy="8" r="1"></circle><circle cx="9.5" cy="14.5" r="1"></circle><circle cx="14.5" cy="14.5" r="1"></circle></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.5px">DMX</span><span style="font-size: 13px; color: #9AA1AC">Adresses et patch</span></span>
    </button>
    <button type="button" onClick="{{goPower}}" style="height: 116px; border-radius: 20px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; text-align: left">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.5px">POWER</span><span style="font-size: 13px; color: #9AA1AC">Lignes, multi, phases</span></span>
    </button>
    <button type="button" onClick="{{goRigg}}" style="height: 116px; border-radius: 20px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; text-align: left">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h20M2 16h20M2 8l4 8 4-8 4 8 4-8 4 8"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.5px">RIGG</span><span style="font-size: 13px; color: #9AA1AC">Abaques de ponts</span></span>
    </button>
    <button type="button" onClick="{{goCot}}" style="height: 116px; border-radius: 20px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; text-align: left">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 9h20"></path><path d="M2 6v6M22 6v6"></path><circle cx="8" cy="15" r="2"></circle><circle cx="16" cy="15" r="2"></circle><path d="M2 20h20M2 18v4M22 18v4"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.5px">COTATION</span><span style="font-size: 13px; color: #9AA1AC">Répartir sur un pont</span></span>
    </button>
    <button type="button" onClick="{{goNet}}" style="height: 116px; border-radius: 20px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 18px; text-align: left">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="5" rx="1"></rect><rect x="2" y="17" width="6" height="5" rx="1"></rect><rect x="16" y="17" width="6" height="5" rx="1"></rect><path d="M12 7v5M5 17v-5h14v5"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.5px">RÉSEAU</span><span style="font-size: 13px; color: #9AA1AC">Mémo IP et switchs</span></span>
    </button>
    <button type="button" onClick="{{goAutre}}" style="height: 116px; border-radius: 20px; border: 1px dashed #3A3F48; background: transparent; color: #EEF0F3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 18px; text-align: left">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9AA1AC" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M17.5 14v7M14 17.5h7"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.5px">AUTRE</span><span style="font-size: 13px; color: #9AA1AC">Base et outils de calcul</span></span>
    </button>
  </div>
  <div style="margin-top: auto; display: flex; justify-content: center">
    <span style="font-size: 13px; color: #9AA1AC; border: 1px solid #2C3038; border-radius: 999px; padding: 8px 14px; display: flex; gap: 8px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3FD08A"></span>Hors ligne · {{fixtureCount}} projecteurs · {{trussCount}} abaques</span>
  </div>
</div>
</sc-if>


<sc-if value="{{isTool}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; border-bottom: 1px solid #20232A">
  <button type="button" onClick="{{goBack}}" aria-label="Retour" style="height: 44px; min-width: 44px; padding: 0 12px 0 6px; border-radius: 12px; border: none; background: transparent; color: #7CC4FF; font-size: 15px; display: flex; align-items: center; gap: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>{{backLabel}}</button>
  <div style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.5px">{{toolTitle}}</div>
  <sc-if value="{{showReset}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{doReset}}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>{{resetLabel}}</button>
  </sc-if>
</div>
</sc-if>


<sc-if value="{{isPower}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 18px">

  <div style="border-radius: 16px; padding: 14px 16px; border: 1.5px solid {{pw.vColor}}; background: {{pw.vBg}}; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; color: {{pw.vColor}}">{{pw.vWord}}</span><span style="font-size: 15px; font-weight: 600">{{pw.vTitle}}</span></div>
    <div style="font-size: 13px; color: #C5CAD2">{{pw.vSub}}</div>
  </div>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA1AC">ALIMENTATION</div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{pw.sources}}" as="src" hint-placeholder-count="5">
        <button type="button" onClick="{{src.pick}}" aria-pressed="{{src.on}}" style="height: 48px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 1.1; {{src.style}}">{{src.label}}</button>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA1AC">KIT</span><span style="font-size: 12px; color: #9AA1AC">{{pw.totals}}</span></div>
    <sc-if value="{{pw.empty}}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 14px; border: 1px dashed #3A3F48; padding: 18px; text-align: center; font-size: 14px; color: #9AA1AC">Feuille vide : ajoute tes projecteurs.</div>
    </sc-if>
    <sc-for list="{{pw.items}}" as="it" hint-placeholder-count="2">
      <div style="border-radius: 14px; background: #17191D; border: 1px solid #2C3038; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #9AA1AC">{{it.brand}}</span><span style="font-weight: 600; font-size: 16px">{{it.name}}<sc-if value="{{it.ext}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Données d’une source externe" style="display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: #FFB0202E; margin-left: 6px; vertical-align: -2px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFC75A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></span></sc-if></span></div>
          <button type="button" onClick="{{it.minus}}" aria-label="Retirer un" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2C3038; background: #20232A; color: #EEF0F3; font-size: 22px">−</button>
          <span style="width: 36px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px">{{it.qty}}</span>
          <button type="button" onClick="{{it.plus}}" aria-label="Ajouter un" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2C3038; background: #20232A; color: #EEF0F3; font-size: 22px">+</button>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px">
          <span style="background: #20232A; border-radius: 8px; padding: 5px 8px; font-family: 'JetBrains Mono', monospace">{{it.unitA}} A / u</span>
          <span style="background: #20232A; border-radius: 8px; padding: 5px 8px">cos φ {{it.pf}}</span>
          <span style="background: #20232A; border-radius: 8px; padding: 5px 8px">Conseillé <b style="font-family: 'JetBrains Mono', monospace">{{it.adv}}</b> / PC16</span>
          <span style="background: #20232A; border-radius: 8px; padding: 5px 8px; color: #9AA1AC">Max {{it.full}} à 100 %</span>
        </div>
        <sc-if value="{{it.showPer}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 8px; border-top: 1px solid #20232A; padding-top: 10px">
            <span style="font-size: 13px; color: #9AA1AC; flex-grow: 1">Par circuit</span>
            <button type="button" onClick="{{it.perMinus}}" aria-label="Moins par circuit" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2C3038; background: #20232A; color: #EEF0F3; font-size: 18px">−</button>
            <span style="min-width: 24px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700">{{it.per}}</span>
            <button type="button" onClick="{{it.perPlus}}" aria-label="Plus par circuit" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2C3038; background: #20232A; color: #EEF0F3; font-size: 18px">+</button>
            <span style="min-width: 104px; text-align: right; font-size: 12px; font-weight: 600; color: {{it.perColor}}">{{it.perNote}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <button type="button" onClick="{{openPickPower}}" style="height: 48px; border-radius: 14px; border: 1px dashed #3A3F48; background: transparent; color: #7CC4FF; font-size: 15px; font-weight: 600">+ Ajouter un projecteur</button>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA1AC">DISTRIBUTION</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{pw.multis}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 44px; border-radius: 12px; font-size: 13px; font-weight: 600; {{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
    <button type="button" onClick="{{toggleSame}}" aria-pressed="{{pw.sameOn}}" style="min-height: 48px; border-radius: 12px; border: 1px solid #2C3038; background: #17191D; color: #EEF0F3; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 14px">
      <span style="width: 40px; height: 24px; border-radius: 12px; position: relative; flex-shrink: 0; {{pw.sameTrack}}"><span style="position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #0D0E10; {{pw.sameKnob}}"></span></span>
      Un seul type de projecteur par circuit
    </button>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9AA1AC">Seuil conseillé
      <sc-for list="{{pw.marges}}" as="mg" hint-placeholder-count="4">
        <button type="button" onClick="{{mg.pick}}" aria-pressed="{{mg.on}}" style="height: 36px; min-width: 52px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; {{mg.style}}">{{mg.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 12px; font-size: 12px; color: #9AA1AC; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3FD08A"></span>OK ≤ {{pw.margeTxt}}</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FFB020"></span>Attention : chargé, déconseillé</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FF5A5F"></span>Dépasse &gt; 100 %</span>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA1AC">PHASES · {{pw.srcLabel}}</div>
    <sc-for list="{{pw.phases}}" as="ph" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 92px; gap: 10px; align-items: center">
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700">{{ph.name}}</span>
        <span style="height: 14px; border-radius: 7px; background: #20232A; overflow: hidden; position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ph.w}}%; background: {{ph.color}}; border-radius: 7px"></span><span style="position: absolute; top: -2px; bottom: -2px; left: {{pw.margePos}}%; width: 2px; background: #EEF0F3; opacity: 0.5"></span></span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right"><b>{{ph.amps}}</b> A <span style="color: #9AA1AC">{{ph.pct}}</span></span>
      </div>
    </sc-for>
    <div style="font-size: 12px; color: #9AA1AC">{{pw.balance}}</div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #9AA1AC">CIRCUITS</span><span style="font-size: 12px; color: #9AA1AC">{{pw.circSummary}}</span></div>
    <div style="border-radius: 14px; border: 1px solid #2C3038; overflow: hidden">
      <sc-for list="{{pw.circuits}}" as="c" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 74px minmax(0, 1fr) 30px 64px; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid #20232A; background: #131518; font-size: 13px">
          <span style="font-family: 'JetBrains Mono', monospace; color: #9AA1AC; font-size: 12px">{{c.slot}}</span>
          <span style="font-weight: 500">{{c.content}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; color: #7CC4FF; font-size: 12px">{{c.ph}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; text-align: right; font-weight: 700; color: {{c.color}}">{{c.amps}} A</span>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: #9AA1AC; line-height: 1.4">Calcul : I = P / (230 V × cos φ). Valeurs constructeur ; cos φ non publié : 0,85 par défaut, signalé « estimé ».</div>
  </section>
</div>
</sc-if>


<sc-if value="{{isDmx}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 32px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #17191D; border-radius: 14px; padding: 4px">
    <button type="button" onClick="{{tabQuick}}" aria-pressed="{{dx.quickOn}}" style="height: 44px; border-radius: 11px; border: none; font-size: 15px; font-weight: 600; {{dx.quickStyle}}">Rapide</button>
    <button type="button" onClick="{{tabPatch}}" aria-pressed="{{dx.patchOn}}" style="height: 44px; border-radius: 11px; border: none; font-size: 15px; font-weight: 600; {{dx.patchStyle}}">Feuille de patch</button>
  </div>

  <sc-if value="{{dx.quickOn}}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column; gap: 14px">
    <button type="button" onClick="{{openPickQuick}}" style="border-radius: 14px; background: #17191D; border: 1px solid #2C3038; padding: 12px 14px; color: #EEF0F3; display: flex; align-items: center; text-align: left; gap: 8px">

<script>/* NTOOL : lecture d'une fiche technique (PDF ou photo) par Claude, via la capacité sample */
(function () {
  var KEYS = /(power|consumption|watt|\bW\b|weight|kg|dmx|channel|mode|personality|cos|factor|PF|consommation|puissance|poids|canaux|canali|consumo|peso|leistung|gewicht|kanal|VA\b)/i;
  async function pdfText(file) {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var pages = [];
    for (var i = 1; i <= pdf.numPages; i++) {
      var pg = await pdf.getPage(i), tc = await pg.getTextContent();
      pages.push(tc.items.map(function (it) { return it.str; }).join(' ').replace(/\s+/g, ' ').trim());
    }
    return { pdf: pdf, pages: pages };
  }
  async function renderPages(pdf, nums) {
    var out = [];
